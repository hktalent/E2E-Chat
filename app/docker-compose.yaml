version: '3'
services:
  my-app:
    # docker-compose up -d --build
    image: node:20-alpine
    container_name: e2e_chat
    restart: unless-stopped
    working_dir: /app
    ports:
      - "2083:2083"  # 映射容器端口到主机端口
    volumes:
      - .:/app
      - ../ca:/ca   # 可选：本地 https 证书（自行签发，仓库不提供）
    environment:
      # 多协议频道（IRC/Matrix/XMPP）：全部可选，不配即直连（失败仅影响对应协议）
      IM_SOCKS_PROXY: "${IM_SOCKS_PROXY:-}"
      IM_HTTP_PROXY: "${IM_HTTP_PROXY:-}"
      IM_IRC_LOCAL: "${IM_IRC_LOCAL:-}"
      IM_IRC_SERVERS_JSON: "${IM_IRC_SERVERS_JSON:-}"
      IM_IRC_NICK: "${IM_IRC_NICK:-}"
      IM_IRC_PASS: "${IM_IRC_PASS:-}"
      IM_MATRIX_HS: "${IM_MATRIX_HS:-}"
      IM_MATRIX_TOKEN: "${IM_MATRIX_TOKEN:-}"
      IM_XMPP_JID: "${IM_XMPP_JID:-}"
      IM_XMPP_PASS: "${IM_XMPP_PASS:-}"
    command: /app/run.sh
