version: '3'
services:
  my-app:
    # docker-compose up -d --build
    image: node:20-alpine
    container_name: e2e_chat
    restart: unless-stopped
    working_dir: /app
    ports:
      - "2083:2083"  # 映射容器端口到主机端口
    volumes:
      - .:/app
      - ../ca:/ca   # 可选：本地 https 证书（自行签发，仓库不提供）
    command: /app/run.sh
