<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多协议频道 · IRC / Matrix / XMPP</title>
<style>
  :root{
    --bg:#0f1115;--panel:#161a22;--panel2:#1d222c;--line:#2a303c;
    --txt:#e6e9ef;--dim:#98a1b3;--accent:#4f8cff;--ok:#3ecf8e;--warn:#f5a524;--err:#ef5b5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12px}
  #protos{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);font-size:12px;cursor:default}
  .dot{width:8px;height:8px;border-radius:50%;background:#666}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.off{background:#4a5162}
  main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px 18px 18px;height:calc(100vh - 58px)}
  .panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .bar input[type=search],.bar select{background:#0f131a;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
  .bar input[type=search]{flex:1;min-width:150px}
  .bar button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .bar button:hover{border-color:var(--accent)}
  .bar button:disabled{opacity:.5;cursor:not-allowed}
  .list{flex:1;overflow:auto;min-height:0}
  .row{display:grid;grid-template-columns:1fr 88px 62px 64px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid #20242d;cursor:pointer}
  .row:hover{background:#1b2028}
  .row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tp{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tg{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px;justify-self:start}
  .row .mb{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .row .go{background:transparent;border:1px solid var(--line);color:var(--accent);border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer}
  .row .go:hover{border-color:var(--accent)}
  .chat{display:flex;flex-direction:column;flex:1;min-height:0}
  .chead{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;gap:10px;align-items:center}
  .chead .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chead .p{font-size:11px;color:var(--dim)}
  .chead button{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{padding:7px 10px;border-radius:10px;background:#1a1f28;max-width:92%;word-break:break-word}
  .msg.self{align-self:flex-end;background:#22314d}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:2px}
  .composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel2)}
  .composer input{flex:1;background:#0f131a;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;outline:none}
  .composer button{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
  .hint{padding:14px;color:var(--dim);font-size:12px}
  .err{padding:8px 12px;color:var(--err);font-size:12px;border-bottom:1px solid var(--line)}
  @media (max-width:900px){main{grid-template-columns:1fr;height:auto}.panel{min-height:320px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>多协议频道</h1>
    <div class="sub">IRC · Matrix · XMPP 统一浏览与加入，协议由频道地址自动匹配</div>
  </div>
  <div id="protos"></div>
</header>

<main>
  <section class="panel">
    <div class="bar">
      <input id="q" type="search" placeholder="搜索频道名或话题…" autocomplete="off">
      <select id="proto">
        <option value="all">全部协议</option>
        <option value="irc">IRC</option>
        <option value="matrix">Matrix</option>
        <option value="xmpp">XMPP</option>
      </select>
      <button id="refresh">刷新列表</button>
    </div>
    <div id="errs"></div>
    <div class="list" id="list"><div class="hint">正在拉取频道列表…（IRC LIST 首次可能需要几秒到十几秒）</div></div>
  </section>

  <section class="panel">
    <div class="chead">
      <div style="min-width:0">
        <div class="t" id="curName">未加入频道</div>
        <div class="p" id="curMeta">从左侧选择一个频道加入</div>
      </div>
      <button id="leave" disabled>离开</button>
    </div>
    <div class="chat">
      <div class="msgs" id="msgs"><div class="hint">加入频道后这里会显示消息。</div></div>
      <div class="composer">
        <input id="text" placeholder="输入消息，回车发送" disabled>
        <button id="send" disabled>发送</button>
      </div>
    </div>
  </section>
</main>

<script src="/js/im-client.js?v=20261124a" defer></script>
</body>
</html>
