<!DOCTYPE html>
<html lang="zh-cn">
<head>
	<title>secure chat system</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" id="visualViewport" content="height=device-height,width=device-width,initial-scale=1,minimum-scale=1.0,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
	<meta name=apple-mobile-web-app-capable content=yes>
  	<meta name=mobile-web-app-capable content=yes>
	<link href="/css/," rel="stylesheet" />
	<script src="/socket.io/socket.io.js"></script>
	<script data-polyfill=kindle>if(!Object.bind)document.write('<script src="/js/kindle.js"><\x2fscript>');</script>
  	<script data-polyfill=ie11>try{new CustomEvent('💩')}catch(_){document.write('<script src="/js/ie.js"><\x2fscript>')}</script>
	<script src="/js/,"></script>
</head>
<body>
	<main class="container">
		<div class="row1">
			<div class="cel1">Channel<input type="text" value="xxx" title="Channel (password, chat room name)" id="cnId" results=10></div>
			<div class="cel1">nickName<input type="text" id="nick" value="xxx1" results=10></div>
			
			<div class="cel1">
				<span class="txtChat" title="Set the countdown minutes for automatic destruction after message reading"><input id="clsTm" type="number" min="1" max="180" value="1" class="input" size="2">Minute</span>
				<span class="txtChat">Destroy<input type="checkbox" class="btn btn-secondary" title="Automatic reading and destruction" id="atRd" checked></span>
				<span class="vChat"> Show Me<input type="checkbox" class="btn btn-secondary" aria-label="Show Me Video" id="showme"></span>
			</div>
			<div class="cel1">
				<input type="button" id="clsId" value="Clear" class="button txtChat">
				<input type="button" id="stChat" value="Text Chat" class="button">
				<input type="button" id="startChat" value="Video Chat" class="button">
			</div>
			<div class="yzhd cel1"><select id="videoSelect"></select> <select id="audioInputSelect"></select> <select id="audioOutputSelect"></select>
				save jpg<input type="checkbox" class="btn btn-secondary" title="save jpg to server" id="saveMe">
				save video<input type="checkbox" class="btn btn-secondary" title="save Me video to server" id="saveMeVD">
				<span id="warnId">Warning</span> 
				<input type="checkbox" id="dspWr" class="btn btn-warning" title="Warning">
			</div>
		</div>
		<div class="row" id="myCtn"></div>
		<div class="txtChat" id="qmI">Member：<w id="otherP"></w></div>
		<div class="msgbox txtChat" id="msgList"></div>
	</main>

	<footer class="txtChat">
	<form action="#"><input id="upFile" type="file">
	<input id="sdMsg" type="text"  enterkeyhint="send"><span placeholder="Select the file to send" id="mId">+</span>
	</form>
	</footer>

	<div id="intro" class="message overflow-x-hide overflow-y-hide shadow">
		<a href="#" id="closebtn">&times;</a>
		Invite friends to chat together
		<i id="roomurl" data-toggle="tooltip" title="click copy"></i>
		<i id="myQrcode"></i>
		<div id="tooManyParticipants" class="message">Too many people may affect performance</div>
