name: 🥳 New Poc List

on:
  push:
    branches:
      - main
  schedule:
    #  every day at 5:30 
    - cron:  '0 15 * * *'  
    - cron:  '0 10 * * *'  
    - cron:  '0 5 * * *'
    - cron:  '0 0 * * *'
  
  workflow_dispatch:

jobs:
  templates:
    runs-on: ubuntu-latest
    if: github.repository == 'hktalent/E2E-Chat'
    steps:
      - uses: actions/checkout@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Dependences
        run: sudo apt install -yy nodejs npm tmux git

      - name: run it
        id: new-additions
        run: |
          git pull
          chmod +x .github/.run.sh
          .github/.run.sh
          ls -lah
          
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Auto update md PoCs lists [$(date)] :robot:" -a
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
