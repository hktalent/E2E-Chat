name: 🥳 New Poc List

on:
  push:
    branches:
      - main
  schedule:
    #  every day at 5:30 
    - cron:  '0 15 * * *'  
    - cron:  '0 10 * * *'  
    - cron:  '0 5 * * *'
    - cron:  '0 0 * * *'
  
  workflow_dispatch:

jobs:
  templates:
    runs-on: ubuntu-latest
    if: github.repository == 'hktalent/E2E-Chat'
    steps:
      - uses: actions/checkout@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Dependences
        run: |
          sudo apt install -yy nodejs npm tmux git
          # sudo add-apt-repository ppa:redislabs/redis
          # sudo apt update -yy
          # sudo apt install  -yy redis
          
          sudo apt install -yy lsb-release
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update -yy
          sudo apt-get install  -yy redis
          # service redis-server start
          ps -ef | grep redis

      - name: run it
        id: new-additions
        run: |
          git pull
          chmod +x .github/.run.sh
          .github/.run.sh
          ls -lah
          
      - name: Commit files
        run: |
          git add dbChat
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Auto update md PoCs lists [$(date)] :robot:" -a
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
